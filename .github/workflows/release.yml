name: 构建并发布

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 打包 Windows 程序
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==6.22.3" "pillow==10.4.0"

      - name: 打包单文件 exe
        working-directory: ui-ios
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name CampusNetIOS `
            --icon app.ico `
            --add-data "index.html;." `
            --add-data "app.ico;." `
            app.py

      - name: 重命名为应用名
        run: |
          Move-Item -LiteralPath "ui-ios/dist/CampusNetIOS.exe" `
                    -Destination "ui-ios/dist/懒得连校园网.exe" -Force
          Get-ChildItem "ui-ios/dist" | Format-Table Name, Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: ui-ios/dist/*.exe
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = (Get-ChildItem "ui-ios/dist/*.exe" | Select-Object -First 1).FullName
          "上传：$exe"

          # 先传附件（--clobber 允许覆盖同名），再修正标题与说明
          gh release upload $tag $exe --clobber
          gh release edit $tag --title "懒得连校园网 $tag" --notes-file .github/release-notes.md

          # 清掉历史遗留的错误命名附件（首次运行不存在，忽略即可）
          gh release delete-asset $tag "default.exe" -y 2>$null
          if ($LASTEXITCODE -ne 0) { "无需清理 default.exe" }

          gh release view $tag --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
